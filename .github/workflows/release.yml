name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Windows executable
        shell: pwsh
        run: .\build.ps1

      - name: Package portable release
        shell: pwsh
        run: |
          $packageDir = "dist/AdbDeviceVitals"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item "src/AdbDeviceVitals/bin/Release/AdbDeviceVitals.exe" $packageDir
          Copy-Item "README.md" $packageDir
          Copy-Item "LICENSE" $packageDir
          Compress-Archive -Path "$packageDir/*" -DestinationPath "dist/AdbDeviceVitals-win-x64.zip" -Force

          $hash = (Get-FileHash "dist/AdbDeviceVitals-win-x64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AdbDeviceVitals-win-x64.zip" | Set-Content "dist/SHA256SUMS.txt" -Encoding ascii

          $tag = "${{ github.ref_name }}"
          $previous = ""
          $described = git describe --tags --abbrev=0 "HEAD^" 2>$null
          if ($LASTEXITCODE -eq 0) { $previous = "$described".Trim() }
          $changes = @()
          if ($previous) { $changes = @(git log "$previous..HEAD" --pretty=format:"- %s" --no-merges) }
          if ($changes.Count -eq 0) { $changes = @("- 维护更新") }
          $notes = @(
            "ADB Device Vitals $tag",
            "",
            ($changes -join "`n"),
            "",
            "下载 AdbDeviceVitals-win-x64.zip，解压后运行 AdbDeviceVitals.exe。",
            "已安装用户可在程序设置中检查更新。更新会替换当前程序，并保留原来的路径。"
          )
          $notes -join "`n" | Set-Content "dist/release-notes.md" -Encoding utf8

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist/AdbDeviceVitals-win-x64.zip" `
            "dist/SHA256SUMS.txt" `
            --verify-tag `
            --latest `
            --title "ADB Device Vitals ${{ github.ref_name }}" `
            --notes-file "dist/release-notes.md"
